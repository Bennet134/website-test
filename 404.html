<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Seite nicht gefunden – BERGHOFF GmbH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@800;900&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon-96x96.png?v=1.0" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1.0" />
  <link rel="shortcut icon" href="favicon.ico?v=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1.0" />
  <meta name="apple-mobile-web-app-title" content="BERGHOFF" />
  <link rel="manifest" href="site.webmanifest?v=1.0" />

  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  img { display: block; max-width: 100%; }
  a { text-decoration: none; color: inherit; }

  :root {
    --blue:   #00A0E4;
    --blue-d: #0081B8;
    --black:  #080808;
    --white:  #ffffff;
    --off:    #f5f5f5;
    --border: #e4e4e4;
    --text:   #1a1a1a;
    --muted:  #6b6b6b;
    --nav-h:  64px;
    --pad:    clamp(1.5rem,7vw,8rem);
    --r:      2px;
    --trans:  220ms ease;
  }

  html { scroll-behavior: smooth; font-size: 16px; background: #091120; }
  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--white);
    background: #091120;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  
  .nav {
    position: fixed; inset: 0 0 auto;
    height: var(--nav-h); z-index: 300;
    background: rgba(9,17,32,.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center;
    padding: 0 var(--pad);
    justify-content: space-between;
  }
  .nav-logo img { height: 34px; width: auto; }
  .nav-back {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: 'Roboto Condensed', sans-serif; font-size: .75rem; font-weight: 600;
    color: rgba(255,255,255,.7); letter-spacing: .04em;
    transition: color var(--trans);
  }
  .nav-back:hover { color: var(--white); }
  .nav-back svg { width: 14px; height: 14px; }

  
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--nav-h) + 4rem) var(--pad) 4rem;
    text-align: center;
  }

  .err-wrap { max-width: 620px; }

  .err-code {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: clamp(6rem, 20vw, 12rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(0,159,227,.4);
    margin-bottom: 1.5rem;
    user-select: none;
  }

  .err-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 1.25rem;
  }

  .err-title {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }

  .err-sub {
    font-size: .95rem;
    color: rgba(255,255,255,.55);
    line-height: 1.65;
    margin-bottom: 2.5rem;
  }

  .err-links {
    display: flex;
    gap: .75rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }

  .btn {
    display: inline-flex; align-items: center; gap: .4rem;
    font-family: 'Roboto Condensed', sans-serif; font-size: .78rem; font-weight: 700;
    letter-spacing: .04em; padding: .75rem 1.5rem; border-radius: var(--r);
    transition: background var(--trans), color var(--trans), border-color var(--trans);
    cursor: pointer;
  }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-primary:hover { background: var(--blue-d); }
  .btn-ghost { background: transparent; color: rgba(255,255,255,.75); border: 1.5px solid rgba(255,255,255,.2); }
  .btn-ghost:hover { border-color: rgba(255,255,255,.6); color: var(--white); }

  .err-nav {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 2rem;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .err-nav a {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: .72rem;
    font-weight: 600;
    color: rgba(255,255,255,.4);
    letter-spacing: .04em;
    transition: color var(--trans);
  }
  .err-nav a:hover { color: var(--blue); }

  
  main::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,159,227,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,159,227,.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  .err-wrap { position: relative; z-index: 1; }

  @media (max-width: 480px) {
    .err-code { font-size: clamp(5rem, 22vw, 8rem); }
    .err-links { flex-direction: column; align-items: center; }
    .btn { width: 100%; justify-content: center; max-width: 280px; }
  }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <img src="images/logo/berghoff-logo-hell.png" alt="BERGHOFF GmbH" width="140" height="20">
  </a>
  <a href="javascript:history.back()" class="nav-back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 12L6 8l4-4"/>
    </svg>
    Zurück
  </a>
</nav>

<main>
  <div class="err-wrap">
    <div class="err-code">404</div>
    <p class="err-label">Seite nicht gefunden</p>
    <h1 class="err-title">Diese Seite existiert nicht.</h1>
    <p class="err-sub">
      Die gesuchte Seite wurde möglicherweise verschoben, umbenannt oder gelöscht.<br>
      Vielleicht hilft Ihnen einer dieser Links weiter.
    </p>

    <div class="err-links">
      <a href="index.html" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l5-5 5 5M5 14V9h6v5"/>
        </svg>
        Zur Startseite
      </a>
      <a href="index.html#kontakt" class="btn btn-ghost">Kontakt aufnehmen</a>
    </div>

    <nav class="err-nav" aria-label="Weitere Seiten">
      <a href="branchen.html">Branchen</a>
      <a href="maschinenpark.html">Maschinenpark</a>
      <a href="ueber-berghoff.html">Über BERGHOFF</a>
      <a href="lieferant.html">Lieferant werden</a>
      <a href="agb.html">AGB &amp; Dokumente</a>
    </nav>
  </div>
</main>

</body>
</html>
